[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mmo-file-tools"
version = "1.5.0"
description = "MMO FileTools — webapp for Desktop for diverse File handlings"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "Pillow>=10.0.0",
    "xxhash>=3.4.0",
    "pypdfium2>=4.0.0",
    "pywebview>=4.0.0",
    "aiofiles>=23.2.0",
    "sqlalchemy>=2.0.0",
    "Send2Trash>=1.8.0",
    "platformdirs>=4.0.0",
    "pydicom>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
mmo-file-tools = "mmo_file_tools.main:run_web"
mmo-file-tools-desktop = "mmo_file_tools.desktop:run_desktop"

[tool.pytest.ini_options]
testpaths = ["mmo_file_tools/tests"]
addopts = "--cov=mmo_file_tools --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["mmo_file_tools"]
omit = ["mmo_file_tools/tests/*"]

[tool.hatch.build.targets.wheel]
packages = ["mmo_file_tools"]
