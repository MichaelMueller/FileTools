[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-tools"
version = "0.1.0"
description = "Webapp for Desktop for diverse File handlings"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "xxhash>=3.4.0",
    "pywebview>=4.0.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
file-tools = "file_tools.main:run_web"
file-tools-desktop = "file_tools.desktop:run_desktop"

[tool.pytest.ini_options]
testpaths = ["file_tools/tests"]
addopts = "--cov=file_tools --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["file_tools"]
omit = ["file_tools/tests/*"]

[tool.hatch.build.targets.wheel]
packages = ["file_tools"]
